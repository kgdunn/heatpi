<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heatpi</title>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<style>
  /* The page is exactly one screen high: header on top, the plots fill the rest. */
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column;
         font: 15px/1.4 -apple-system, system-ui, sans-serif; background: #fcfcfb; color: #1a1a19; }
  header { flex: none; display: flex; gap: 6px 12px; align-items: center; flex-wrap: wrap; padding: 8px 16px 6px; }
  h1 { font-size: 17px; margin: 0; }
  select, button { font: inherit; padding: 4px 8px; }
  header a { color: #1c5cab; font-size: 14px; }
  #status { color: #6b6a66; font-size: 13px; margin-left: auto; }
  #status:empty { display: none; }   /* only "Loading…" or an error: no line otherwise */
  #legend { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; font-size: 13px; color: #3d3c39; }
  #legend button { font: inherit; color: inherit; background: none; border: 0; padding: 8px 3px; cursor: pointer; }
  #legend button[aria-pressed="false"] { opacity: 0.35; text-decoration: line-through; }   /* hidden */
  #legend i { display: inline-block; width: 18px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 5px; }
  #legend .dotted { border-top-style: dotted; border-color: #6b6a66; }
  #legend .dashed { border-top: 2px dashed #5b5a56; }
  #legend .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: rgba(91,90,86,0.5);
                 vertical-align: middle; margin: 0 6px 0 5px; }
  #legend .group { display: inline-flex; align-items: center; gap: 0 8px; margin-left: 8px; }  /* wraps as one */
  #legend .group > span { color: #6b6a66; }
  #version { font-size: 11px; line-height: 1.3; color: #6b6a66; text-align: right; }
  #version b { color: #b3261e; }
  @media (max-width: 760px) {      /* phone: the code version top right, the time range on its own line */
    header { column-gap: 8px; }
    h1 { font-size: 15px; }
    select, button { padding: 4px 6px; }
    #version { order: 1; margin-left: auto; }
    #status { order: 2; flex-basis: 100%; text-align: right; }
    #legend { order: 3; }
  }
  #plots { flex: 1; min-height: 0; width: 100%; transition: opacity 0.15s; }
</style>
</head>
<body>
<header>
  <h1>Home heating</h1>
  <select id="hours">
    <option value="24" selected>24 h</option>
    <option value="72">3 days</option>
    <option value="168">7 days</option>
  </select>
  <button id="refresh">Refresh</button>
  <a href="balance.html">Heat balance</a>
  <a href="schedule.html">Schedules</a>
  <span id="status"></span>
  <div id="version"></div>
  <div id="legend"></div>
</header>
<div id="plots"></div>

<script>
// Colour follows the room, never its position (checked for colour-blind separation).
const ROOM_COLOR = { "Badkamer": "#2a78d6", "Bedroom": "#eb6834", "Logeer": "#1f9e89", "Living Room": "#b0389b",
                     "BnB": "#8a6d00" };            // BnB: the home above, from its tado
const UPSTAIRS = new Set(["Living Room"]);
const NEUTRAL = "#5b5a56", LIGHT = "#a3a29d", PRIOR = "#f0a6c6";   // PRIOR: light pink, a day earlier
const KNMI = "#6da7ec";                            // light blue: the official station, next to the grey street line
const HOUR = 3600e3;
let data = null;                                   // last fetch, reused when the screen rotates
let view = 0;                                      // bumped by Refresh or a new range: resets any zoom

async function getSeries(name, hours) {
  const r = await fetch(`/api/${name}?hours=${hours}`);
  if (!r.ok) throw Object.assign(new Error(`${name}: ${r.status} ${r.statusText}`), { status: r.status });
  return r.json();
}

// Long columns (time, zone, temp_c, setpoint_c) -> Map zone -> {time, temp, setpoint}.
function byZone(d) {
  const zones = new Map();
  d.time.forEach((t, i) => {
    if (!zones.has(d.zone[i])) zones.set(d.zone[i], { time: [], temp: [], setpoint: [] });
    const z = zones.get(d.zone[i]);
    z.time.push(t); z.temp.push(d.temp_c[i]); z.setpoint.push(d.setpoint_c[i]);
  });
  return zones;
}

// Time axis: Plotly picks the tick spacing (so it keeps working when you zoom), at most as many
// ticks as fit the panel; the label format follows the spacing. One-day view: hours only, never a
// date. Longer views: "17 Nov, 04". Zoomed in to ticks under an hour apart: "07:30".
function timeAxis(hours, panelPx) {
  const oneDay = hours <= 24;
  const stops = [{ dtickrange: [null, HOUR - 1], value: "%H:%M" },
                 { dtickrange: [HOUR, oneDay ? null : 3 * HOUR], value: "%H" }];
  if (!oneDay) stops.push({ dtickrange: [3 * HOUR + 1, null], value: "%d %b, %H" });
  // Each tick gets room for its label: "07" needs about 30 px, "17 Nov, 04" about 90 px.
  return { type: "date", tickangle: 0, tickformatstops: stops,
           nticks: Math.max(3, Math.floor(panelPx / (oneDay ? 30 : 90))),
           hoverformat: oneDay ? "%H:%M" : "%d %b %H:%M" };
}

// Width of the outdoor smoother (Gaussian sigma): a reading 1 h away counts 41% as much as the one at
// that moment, 2 h away 3%, so the curve mostly follows the three nearest hourly readings.
const SMOOTH_HOURS = 0.75;
// Technical room, temperature and noise: a reading every minute. A 30-minute width irons out the
// 0.1 °C steps and the minute-to-minute jitter, but keeps the rise and fall of each heat-pump run
// (they last an hour or more).
const TECH_SMOOTH_HOURS = 0.5;
const toTime = s => new Date(s.replace(" ", "T")).getTime();          // local wall-clock string -> ms
const toLocal = ms => { const d = new Date(ms);
  return `${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())} ${two(d.getHours())}:${two(d.getMinutes())}:00`; };

// Local linear regression with Gaussian weights (a LOESS-style smoother): at every 10 minutes, fit
// a straight line to the nearby points, weighted by distance, and keep its value there.
// The curve follows the trend without being forced through each point, and stays honest at the ends.
// Only points within 4 widths count (further out a weight is below 0.03%), which keeps a week of
// minute data fast; where the data has a gap that wide, the curve has a gap too.
function smooth(times, values, sigmaHours = SMOOTH_HOURS, stepMin = 10) {
  const pts = times.map((t, i) => [toTime(t), values[i]]).filter(([, v]) => v != null);
  if (pts.length < 3) return { x: [], y: [] };
  const x = [], y = [], reach = 4 * sigmaHours * HOUR;
  let lo = 0;
  for (let t0 = pts[0][0]; t0 <= pts.at(-1)[0]; t0 += stepMin * 60e3) {
    while (pts[lo][0] < t0 - reach) lo++;
    let sw = 0, sd = 0, sv = 0, sdd = 0, sdv = 0;
    for (let i = lo; i < pts.length && pts[i][0] <= t0 + reach; i++) {
      const [t, v] = pts[i], d = (t - t0) / HOUR, w = Math.exp(-0.5 * (d / sigmaHours) ** 2);
      sw += w; sd += w * d; sv += w * v; sdd += w * d * d; sdv += w * d * v;
    }
    const det = sw * sdd - sd * sd;
    x.push(toLocal(t0));
    y.push(sw < 1e-6 ? null : det > 1e-9 ? (sv * sdd - sd * sdv) / det : sv / sw);
  }
  return { x, y };
}

// Axis range from the 1st to the 99th percentile plus a margin: a door slam or a glitch can't
// squash everything else into a flat line. Too few points: let Plotly choose.
function robustRange(values) {
  const v = values.filter(x => x != null).sort((a, b) => a - b);
  if (v.length < 10) return undefined;
  const q = p => v[Math.floor(p * (v.length - 1))], lo = q(0.01), hi = q(0.99), pad = 0.1 * (hi - lo) || 1;
  return [lo - pad, hi + pad];
}

// Why an optional series is empty, said in its panel title: the server refused it ("HTTP 404": the
// dashboard runs older code; "HTTP 503": no such table yet), or the logger wrote nothing in this period.
const missing = (d, what) => (d.error ? `${what}: ${d.error}` : `no ${what} data in this period`);
const optional = (name, hours, empty) =>
  getSeries(name, hours).catch(e => ({ ...empty, error: `HTTP ${e.status ?? "error"}` }));

const axis = i => (i === 0 ? "" : String(i + 1));  // panel i -> Plotly axis suffix
const panelTitle = (i, text) => ({ text, xref: `x${axis(i)} domain`, yref: `y${axis(i)} domain`,
                                   x: 0, y: 1.02, showarrow: false, xanchor: "left", yanchor: "bottom" });
const two = n => String(n).padStart(2, "0");

// Legend entries are buttons: tap one to hide or show its lines. The choice is remembered on this
// device (browser storage; if that is unavailable, it simply lasts until the page reloads).
const hidden = new Set((() => { try { return JSON.parse(localStorage.getItem("hidden")) ?? []; } catch { return []; } })());
const shown = id => !hidden.has(id);
const legendKey = (id, label, swatch) =>
  `<button type="button" data-key="${id}" aria-pressed="${shown(id)}" title="Tap to hide or show">${swatch}${label}</button>`;
document.getElementById("legend").onclick = e => {
  const id = e.target.closest("button")?.dataset.key;
  if (!id) return;
  hidden.has(id) ? hidden.delete(id) : hidden.add(id);
  try { localStorage.setItem("hidden", JSON.stringify([...hidden])); } catch {}
  render();
};

// Heat-pump panel: tap its title to switch between kWh per day ("kwh") and power in kW ("kw").
// Remembered on this device, like the hidden lines.
let hpMode = (() => { try { return localStorage.getItem("hpMode") ?? "kwh"; } catch { return "kwh"; } })();
function toggleHeatPump() {
  hpMode = hpMode === "kwh" ? "kw" : "kwh";
  try { localStorage.setItem("hpMode", hpMode); } catch {}
  render();
}

// One room: its temperature (hover shows "Bedroom: 18.5 °C [19.0]", setpoint in brackets) and a
// dotted setpoint line that stays out of the hover box.
function roomTraces(name, z, panel) {
  const color = ROOM_COLOR[name] ?? NEUTRAL, ax = { xaxis: "x" + axis(panel), yaxis: "y" + axis(panel) };
  return [{ ...ax, x: z.time, y: z.temp, customdata: z.setpoint, name, line: { color, width: 2 },
            visible: shown(name), hovertemplate: `${name}: %{y:.1f} °C [%{customdata:.1f}]<extra></extra>` },
          { ...ax, x: z.time, y: z.setpoint, name: `${name} setpoint`, hoverinfo: "skip",
            visible: shown(name) && shown("setpoint"), line: { color, width: 1.5, shape: "hv", dash: "dot" } }];
}

// A room's forecast (living room and bedroom only, from rooms.py): the setpoint evohome will ask, dotted,
// and the temperature from the rough room model, dashed, both in the room's colour.
function roomForecastTraces(name, f, panel) {
  const color = ROOM_COLOR[name] ?? NEUTRAL, ax = { xaxis: "x" + axis(panel), yaxis: "y" + axis(panel) };
  const on = shown(name) && shown("forecast"), rms = f.model?.rms_k, held = f.model?.why;
  return [{ ...ax, x: f.setpoint.time, y: f.setpoint.value, name: `${name} setpoint, forecast`, mode: "lines",
            visible: on && shown("setpoint"),
            line: { color, width: 1.5, dash: "dot" }, hovertemplate: `${name} setpoint, forecast: %{y:.1f} °C<extra></extra>` },
          { ...ax, x: f.temp.time, y: f.temp.value, name: `${name}, forecast`, mode: "lines", visible: on,
            line: { color, width: 2, dash: "dash" },
            hovertemplate: held ? `${name}: held at the last reading, %{y:.1f} °C (no room model yet)<extra></extra>`
                                : `${name}, forecast: %{y:.1f} °C` + (rms != null ? ` (±${rms.toFixed(1)} K over the last day)` : "") +
                                  "<extra></extra>" }];
}

// Heat pump: kWh since midnight, back to 0 at 00:00. A gap at each midnight keeps the line from
// dropping vertically; `totals` holds each day's last value (a whole day's use, or today so far).
function dailyEnergy(e) {
  const x = [], y = [], totals = [];
  e.time.forEach((t, i) => {
    if (i && t.slice(0, 10) !== e.time[i - 1].slice(0, 10)) {   // a new day starts here
      totals.push([e.time[i - 1], e.kwh[i - 1]]);
      x.push(t); y.push(null);
    }
    x.push(t); y.push(e.kwh[i]);
  });
  if (e.time.length) totals.push([e.time.at(-1), e.kwh.at(-1)]);
  return { x, y, totals };
}

// The 24 h view also shows the 24 h before the window, moved one calendar day later (same clock time;
// right across a summer/winter time change) to lie under today's line in pink. Both reset at midnight,
// so at any moment you compare "kWh so far" with the same moment a day earlier.
function priorDay(e, cutoffMs) {
  const from = toLocal(cutoffMs - 24 * HOUR), cutoff = toLocal(cutoffMs), prior = { time: [], kwh: [] };
  e.time.forEach((t, i) => {
    if (t < from || t >= cutoff) return;
    const d = new Date(t.replace(" ", "T")); d.setDate(d.getDate() + 1);
    prior.time.push(toLocal(d.getTime())); prior.kwh.push(e.kwh[i]);
  });
  return prior;
}

// Each view loads more than it shows, so dragging the time axis back reaches earlier days: twice the
// window (2 days for the 24 h view), at most a week. The page opens on the newest `hours`.
const history = hours => Math.min(2 * hours, 168);

// Today's kWh since midnight carried forward with the forecast L1 power: a dashed line that starts where
// the measured one ends and, like it, goes back to 0 at midnight. `totals`: each day's projected end.
function projection(e, fc) {
  const x = [], y = [], totals = [];
  if (!e.time.length || !fc.time.length) return { x, y, totals };
  let t = toTime(e.time.at(-1)), kwh = e.kwh.at(-1);
  x.push(e.time.at(-1)); y.push(kwh);
  fc.time.forEach((s, i) => {
    const next = toTime(s), midnight = new Date(t);
    if (next <= t) return;
    midnight.setHours(24, 0, 0, 0);
    if (next >= midnight.getTime()) {                  // the day ends: its total, a gap, and 0 again
      kwh += fc.l1_kw[i] * (midnight - t) / HOUR;
      x.push(toLocal(midnight - 60e3), toLocal(+midnight), toLocal(+midnight)); y.push(kwh, null, 0);
      totals.push([toLocal(midnight - 60e3), kwh]);
      t = +midnight; kwh = 0;
    }
    kwh += fc.l1_kw[i] * (next - t) / HOUR; t = next;
    x.push(s); y.push(kwh);
  });
  return { x, y, totals };
}

// The window drawn: the newest `hours`, unless the user dragged or zoomed since the last draw of this
// view; then theirs stays, also through the 5-minute refresh. A new range or Refresh starts over.
let drawnView = -1, autoWindow = null;
function xWindow(start, end) {
  const shown = document.getElementById("plots").layout?.xaxis?.range?.map(v => new Date(String(v).replace(" ", "T")).getTime());
  const moved = view === drawnView && shown && autoWindow &&
                Math.abs(shown[0] - autoWindow[0]) + Math.abs(shown[1] - autoWindow[1]) > 60e3;
  drawnView = view;
  if (moved) return shown.map(toLocal);
  autoWindow = [start, end];
  return autoWindow.map(toLocal);
}

// "Code update / 21 Nov 12:30 UTC": when the code the Pi runs was committed (hover: hash and message).
function showVersion(v) {
  if (!v.time) return;
  const d = new Date(v.time * 1000), el = document.getElementById("version");
  el.innerHTML = `Code update<br>${d.getUTCDate()} ${d.toLocaleString("en-GB", { month: "short", timeZone: "UTC" })} ` +
                 `${two(d.getUTCHours())}:${two(d.getUTCMinutes())} UTC`;
  el.title = `${v.commit}: ${v.subject}`;
  if (v.stale?.length) {      // the page is new, the server not: some data can fail until it restarts
    el.innerHTML += "<br><b>Server needs a restart</b>";
    el.title += `\nThe server still runs older ${v.stale.join(", ")}. On the Pi: sudo systemctl restart dashboard`;
  }
}

function render() {
  if (!data) return;
  const { hours, start, end, zones, evohome, outdoor, knmi, energy, prior, power, tech, noise, fc, bnb, tado } = data;
  const ahead = projection(energy, fc);
  const cumulative = hpMode === "kwh";
  const note = (d, what) => (d.time.length ? "" : ` · <i>${missing(d, what)}</i>`);   // empty panel: say why
  const daily = dailyEnergy(energy), before = dailyEnergy(prior);
  const noiseLine = smooth(noise.time, noise.mean, TECH_SMOOTH_HOURS);

  // Legend as page text, set first so the header has its final height before Plotly measures the space.
  // Rooms in panel order: downstairs (left panel) first, then upstairs (right panel), A-Z within each.
  const rooms = [...zones.keys()].sort((a, b) => UPSTAIRS.has(a) - UPSTAIRS.has(b) || a.localeCompare(b));
  const legend = [...rooms, ...bnb.keys()].map(n => legendKey(n, n, `<i style="border-color:${ROOM_COLOR[n] ?? NEUTRAL}"></i>`));
  // A group label stays on the same line as its keys.
  const group = (label, keys) => `<span class="group"><span>${label}</span>${keys.join("")}</span>`;
  const outdoorKeys = [legendKey("street", "street", `<b class="dot"></b>`)];
  if (knmi.time.length) outdoorKeys.push(legendKey("knmi", "KNMI Rotterdam", `<i style="border-color:${KNMI}"></i>`));
  legend.push(legendKey("setpoint", "setpoint", `<i class="dotted"></i>`), group("Outdoor:", outdoorKeys));
  if (cumulative && prior.time.length)
    legend.push(group("Heat pump:", [legendKey("prior", "a day earlier", `<i style="border-color:${PRIOR}"></i>`)]));
  if (fc.time.length) legend.push(legendKey("forecast", "forecast", `<i class="dashed"></i>`));
  document.getElementById("legend").innerHTML = legend.join("");

  // Panel 0: downstairs rooms together; 1: living room upstairs; 2: outdoor; 3: heat pump circuit;
  // 4: technical room; 5: the BnB above, on its own scale. The technical room's noise sits on the base
  // axis y5 (right) and its temperature on y7, which overlays y5 (left): Plotly draws an overlaying axis
  // on top, so the line stays above the shaded noise.
  const traces = [];
  for (const name of rooms) {
    traces.push(...roomTraces(name, zones.get(name), UPSTAIRS.has(name) ? 1 : 0));
    if (fc.rooms?.[name]) traces.push(...roomForecastTraces(name, fc.rooms[name], UPSTAIRS.has(name) ? 1 : 0));
  }
  for (const [name, z] of bnb) traces.push(...roomTraces(name, z, 5));
  traces.push(
    { ...smooth(outdoor.time, outdoor.temp_c), name: "Street, smoothed", xaxis: "x3", yaxis: "y3",
      visible: shown("street"), line: { color: LIGHT, width: 2 }, hoverinfo: "skip" },
    { x: outdoor.time, y: outdoor.temp_c, name: "Street", xaxis: "x3", yaxis: "y3", mode: "markers",
      visible: shown("street"), marker: { color: NEUTRAL, size: 5, opacity: 0.5 },
      hovertemplate: "Street: %{y:.1f} °C<extra></extra>" },
    // KNMI reports every 10 minutes and jitters; the same smoother as the street line makes the two comparable.
    { ...smooth(knmi.time, knmi.temp_c), name: "KNMI Rotterdam", xaxis: "x3", yaxis: "y3", visible: shown("knmi"),
      line: { color: KNMI, width: 2 }, hovertemplate: "KNMI Rotterdam, smoothed: %{y:.1f} °C<extra></extra>" },
    { x: fc.time, y: fc.temp_c, name: "Forecast", xaxis: "x3", yaxis: "y3", visible: shown("forecast"),
      line: { color: KNMI, width: 2, dash: "dash" }, hovertemplate: "Forecast: %{y:.1f} °C<extra></extra>" },
    ...(cumulative ? [
      { x: before.x, y: before.y, name: "1 day earlier", xaxis: "x4", yaxis: "y4",   // empty unless 24 h view
        visible: shown("prior"), line: { color: PRIOR, width: 2 }, hovertemplate: "1 day earlier: %{y:.1f} kWh<extra></extra>" },
      { x: daily.x, y: daily.y, name: "L1", xaxis: "x4", yaxis: "y4",
        fill: "tozeroy", fillcolor: "rgba(91,90,86,0.18)", line: { color: NEUTRAL, width: 1.5 },
        hovertemplate: "L1 since midnight: %{y:.1f} kWh<extra></extra>" },
      { x: ahead.x, y: ahead.y, name: "Forecast", xaxis: "x4", yaxis: "y4", visible: shown("forecast"),
        line: { color: NEUTRAL, width: 1.5, dash: "dash" }, hovertemplate: "Forecast since midnight: %{y:.1f} kWh<extra></extra>" }] : [
      { x: power.time, y: power.l1_w.map(w => w / 1000), name: "L1", xaxis: "x4", yaxis: "y4",
        fill: "tozeroy", fillcolor: "rgba(91,90,86,0.18)", line: { color: NEUTRAL, width: 1 },
        hovertemplate: "L1: %{y:.2f} kW<extra></extra>" },
      { x: fc.time, y: fc.l1_kw, name: "Forecast", xaxis: "x4", yaxis: "y4", visible: shown("forecast"),
        line: { color: NEUTRAL, width: 1.5, dash: "dash" }, hovertemplate: "Forecast L1: %{y:.2f} kW, hourly mean<extra></extra>" }]),
    { ...noiseLine, name: "Noise", xaxis: "x5", yaxis: "y5",
      fill: "tozeroy", fillcolor: "rgba(91,90,86,0.15)", line: { color: LIGHT, width: 1 },
      hovertemplate: "Noise: %{y:.0f} raw (0-4095)<extra></extra>" },
    { ...smooth(tech.time, tech.temp_c, TECH_SMOOTH_HOURS), name: "Technical room", xaxis: "x5", yaxis: "y7",
      line: { color: NEUTRAL, width: 2 }, hovertemplate: "Technical room: %{y:.1f} °C<extra></extra>" });

  // Three rows: rooms, then outdoor and heat pump, then the BnB and the technical room.
  const width = document.getElementById("plots").clientWidth - 72;
  const COLS = [[0, 0.45], [0.55, 1]], GAP = 0.1, H = (1 - 2 * GAP) / 3;
  const row = r => [1 - (r + 1) * H - r * GAP, 1 - r * H - r * GAP];
  const panels = [[COLS[0], row(0)], [COLS[1], row(0)], [COLS[0], row(1)], [COLS[1], row(1)], [COLS[1], row(2)],
                  [COLS[0], row(2)]];
  const layout = {
    annotations: [panelTitle(0, "<b>Downstairs</b> °C" + note(evohome, "evohome")),
                  panelTitle(1, "<b>Living room</b> (upstairs) °C" + note(evohome, "evohome")),
                  panelTitle(2, "<b>Outdoor</b> °C" + note(outdoor, "street")),
                  { ...panelTitle(3, (cumulative ? "<b>Heat pump L1</b> kWh/day ⇄" : "<b>Heat pump L1</b> kW ⇄") +
                                     note(cumulative ? energy : power, "meter")), captureevents: true },  // tap: switch
                  panelTitle(4, "<b>Technical room</b> °C" + note(tech, "temperature")),   // noise: shaded, right axis
                  panelTitle(5, "<b>BnB</b> (above) °C" + note(tado, "tado"))],
    margin: { t: 24, r: 36, b: 28, l: 36 }, showlegend: false,
    hovermode: "x unified", paper_bgcolor: "#fcfcfb", plot_bgcolor: "#fcfcfb",
    uirevision: view,                              // a zoom survives only the 5-min auto-refresh
  };
  const range = xWindow(start, end);
  panels.forEach(([xDomain, yDomain], i) => {
    layout["xaxis" + axis(i)] = { ...timeAxis(hours, width * (xDomain[1] - xDomain[0])), domain: xDomain,
                                  anchor: "y" + axis(i), matches: i ? "x" : undefined, ...(i ? {} : { range }) };
    // autorange said out loud: with a range on the shared time axis, Plotly otherwise leaves it off.
    layout["yaxis" + axis(i)] = { domain: yDomain, anchor: "x" + axis(i), autorange: true };
  });
  Object.assign(layout.yaxis2, { matches: "y" });
  const peak = Math.max(0, ...[daily, before, ahead].flatMap(d => d.totals.map(([, kwh]) => kwh)));
  Object.assign(layout.yaxis4, cumulative ? { autorange: false, range: [0, 1.15 * peak || 1] }   // headroom for the totals
                                          : { autorange: true, rangemode: "tozero" });
  // Each day's total at the end of its line, when the panel has room (about 32 px per day in view).
  if (cumulative && width * 0.45 / (hours / 24 + 1) >= 32)
    for (const [t, kwh] of daily.totals)
      layout.annotations.push({ x: t, y: kwh, xref: "x4", yref: "y4", text: kwh.toFixed(1), showarrow: false,
                                xanchor: "right", yanchor: "bottom", font: { size: 11, color: "#3d3c39" } });
  if (cumulative && shown("forecast") && width * 0.45 / (hours / 24 + 1) >= 32)   // a forecast total: "≈ 38"
    for (const [t, kwh] of ahead.totals)
      layout.annotations.push({ x: t, y: kwh, xref: "x4", yref: "y4", text: `≈ ${kwh.toFixed(0)}`, showarrow: false,
                                xanchor: "center", yanchor: "bottom", font: { size: 11, color: "#6b6a66" } });
  // A thin line at now in every panel: measured to its left, forecast to its right.
  const nowX = toLocal(Date.now());
  layout.shapes = panels.map((_, i) => ({ type: "line", xref: "x" + axis(i), yref: `y${axis(i)} domain`, x0: nowX, x1: nowX,
                                          y0: 0, y1: 1, layer: "below", line: { color: LIGHT, width: 1 } }));
  const noiseRange = robustRange(noiseLine.y);
  Object.assign(layout.yaxis5, { side: "right", showgrid: false, zeroline: false, autorange: !noiseRange, range: noiseRange });
  layout.yaxis7 = { overlaying: "y5", side: "left", anchor: "x5", autorange: true };
  const plots = document.getElementById("plots");
  Plotly.react(plots, traces, layout, { responsive: true, displayModeBar: false });
  if (!plots.listening) {                        // once: Plotly gives the div .on() at its first plot
    plots.on("plotly_clickannotation", e => e.index === 3 && toggleHeatPump());
    plots.listening = true;
  }
}

async function load() {
  const hours = Number(document.getElementById("hours").value), span = hours + history(hours);
  const status = document.getElementById("status");
  try {
    const none = { time: [], temp_c: [] };
    const [zones, outdoor, energy, power, knmi, tech, noise, version, fc, tado] = await Promise.all([
      optional("zones", span, { time: [], zone: [], temp_c: [], setpoint_c: [] }),
      optional("outdoor", span, none),
      optional("energy", span, { time: [], kwh: [] }),
      optional("power", span, { time: [], total_w: [], l1_w: [] }),       // for the kW view of the heat pump
      optional("knmi", span, none),                          // only once knmi_temp.py runs
      optional("room", span, none),                          // optional sensors: an empty panel, not an error
      optional("loudness", span, { time: [], mean: [] }),
      fetch("/api/version").then(r => r.json()).catch(() => ({})),
      optional("forecast", 48, { time: [], temp_c: [], l1_kw: [] }),     // forecast_logger.py + balance.forecast
      optional("tado", span, { time: [], zone: [], temp_c: [], setpoint_c: [] })]);   // tado_logger.py
    // The window: the last `hours`, and a quarter of that (at least 6 h) of forecast when there is one.
    const now = new Date(), start = now - hours * HOUR, ahead = fc.time.length ? Math.max(6, hours / 4) : 0;
    status.textContent = "";
    showVersion(version);                                    // before render: the header's final height
    const prior = hours <= 24 ? priorDay(energy, start) : { time: [], kwh: [] };
    data = { hours, start, end: now.getTime() + ahead * HOUR, zones: byZone(zones), evohome: zones, outdoor, knmi, energy,
             prior, power, tech, noise, fc, bnb: byZone(tado), tado };
    render();
  } catch (e) {
    status.textContent = `Error: ${e.message}`;
  }
}

// Redraw when the space for the plots changes (rotating the iPad, the header wrapping).
let resizeTimer;
new ResizeObserver(() => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 250); })
  .observe(document.getElementById("plots"));
// A new range or Refresh: say so at once and dim the old picture until the new data is in. The Pi
// needs a few seconds for several days, and without a sign the page seemed not to react.
const resetAndLoad = async () => {
  view++;
  const plots = document.getElementById("plots");
  document.getElementById("status").textContent = "Loading…";
  plots.style.opacity = 0.4;
  await load();
  plots.style.opacity = 1;
};
document.getElementById("hours").onchange = resetAndLoad;
document.getElementById("refresh").onclick = resetAndLoad;
load();
setInterval(load, 5 * 60 * 1000);   // new evohome data arrives every 10 min
</script>
</body>
</html>
